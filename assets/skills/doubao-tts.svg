<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Doubao TTS">
  <!-- Warm Dual-Cone: broadcast diaphragm + two host capsules -->
  <circle cx="16" cy="16" r="13.2" fill="#F0B56A" stroke="#3D2614" stroke-width="1.6"/>
  <circle cx="16" cy="16" r="9.2" fill="none" stroke="#3D2614" stroke-width="1.1" opacity="0.35"/>
  <!-- left host (coral) -->
  <rect x="6.2" y="12.2" width="4.2" height="7.6" rx="2.1" fill="#D4552A" stroke="#3D2614" stroke-width="0.9"/>
  <!-- right host (teal) -->
  <rect x="21.6" y="12.2" width="4.2" height="7.6" rx="2.1" fill="#1F7A7A" stroke="#3D2614" stroke-width="0.9"/>
  <!-- membrane / waveform bars -->
  <rect x="13.1" y="11.2" width="1.5" height="9.6" rx="0.75" fill="#3D2614"/>
  <rect x="15.25" y="9.4" width="1.5" height="13.2" rx="0.75" fill="#3D2614"/>
  <rect x="17.4" y="12.4" width="1.5" height="7.2" rx="0.75" fill="#3D2614"/>
</svg>
