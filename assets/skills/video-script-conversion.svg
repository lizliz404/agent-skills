<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Video Script Conversion">
  <!-- Beat Timeline: horizontal rail + spoken beats + magenta hook -->
  <rect x="2.6" y="8.4" width="26.8" height="15.2" rx="7.6" fill="#E6C84A" stroke="#1C1910" stroke-width="1.6"/>
  <!-- base rail -->
  <path d="M6.4 22.2h19.2" stroke="#1C1910" stroke-width="1.4" stroke-linecap="round"/>
  <!-- hook beat (first five seconds) -->
  <rect x="7.1" y="10.6" width="2.2" height="11.6" rx="1.1" fill="#C2185B" stroke="#1C1910" stroke-width="0.7"/>
  <!-- spoken beats -->
  <rect x="11.4" y="13.4" width="2" height="8.8" rx="1" fill="#1C1910"/>
  <rect x="15.5" y="12.2" width="2" height="10" rx="1" fill="#1C1910"/>
  <rect x="19.6" y="14.6" width="2" height="7.6" rx="1" fill="#1C1910"/>
  <rect x="23.7" y="15.8" width="2" height="6.4" rx="1" fill="#1C1910"/>
</svg>
