<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Video Script Conversion">
  <!-- Script page + play button — readable at 20px -->
  <rect width="32" height="32" rx="8" fill="#1C1915"/>
  <!-- script page -->
  <rect x="8" y="7" width="15" height="18" rx="2" stroke="#E8E4DD" stroke-width="1.3"/>
  <!-- text lines (spoken-word beats) -->
  <rect x="10.8" y="11" width="9" height="1.2" rx="0.6" fill="#E8E4DD"/>
  <rect x="10.8" y="14.5" width="7" height="1.2" rx="0.6" fill="#E8E4DD"/>
  <rect x="10.8" y="18" width="5" height="1.2" rx="0.6" fill="#E8E4DD"/>
  <!-- play button (voice) -->
  <circle cx="22.5" cy="19.5" r="4.5" fill="#B14E22"/>
  <path d="M20.7 17.8v3.4c0 .6.7 1 1.3.6l2.4-1.7c.5-.35.5-1.05 0-1.4l-2.4-1.7c-.6-.4-1.3 0-1.3.6z" fill="#FAF9F5"/>
</svg>
