  <!-- perspective triangle wire -->
  <path d="M16 7.4 L24.2 22.6 L7.8 22.6 Z" fill="none" stroke="#0F766E" stroke-width="1.35" stroke-linejoin="round"/>
  <path d="M16 7.4 L16 22.6" stroke="#0F766E" stroke-width="1.1" opacity="0.55"/>
  <!-- helical dissolve path -->
  <path d="M11.2 20.2 C12.4 16.8, 14.2 14.2, 16.8 12.4 C18.6 11.2, 20.4 11.6, 21.6 13.2" stroke="#134E4A" stroke-width="1.15" fill="none" stroke-linecap="round"/>
  <!-- phosphor particles (dissolve) -->
  <circle cx="11.2" cy="20.2" r="1.55" fill="#F59E0B" stroke="#0F172A" stroke-width="0.6"/>
  <circle cx="14.1" cy="15.6" r="1.2" fill="#F59E0B" stroke="#0F172A" stroke-width="0.55"/>
