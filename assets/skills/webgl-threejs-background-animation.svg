<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="WebGL Three.js Background Animation">
  <!-- Dashed wireframe ink garden — readable at 20px -->
  <rect width="32" height="32" rx="8" fill="#1C1915"/>
  <!-- stem arc (sketch layer, dashed) -->
  <path d="M7 25 C 12 20, 14 10, 22 7" stroke="#E8E4DD" stroke-width="1.3" fill="none" stroke-dasharray="2.6 1.6"/>
  <!-- leaf arc (lighter annotation layer) -->
  <path d="M13 18 C 17 16, 19 12, 21 9" stroke="#716D64" stroke-width="1.1" fill="none" stroke-dasharray="1.8 1.6"/>
  <!-- dimension tick -->
  <path d="M17 22.5 L 23.5 22.5" stroke="#716D64" stroke-width="1.1"/>
  <path d="M23.5 20.5 L 23.5 24.5" stroke="#716D64" stroke-width="1.1"/>
  <!-- accent: dissolve dot (camera / accent category) -->
  <circle cx="22" cy="7" r="1.7" fill="#B14E22"/>
  <circle cx="22" cy="7" r="3.6" stroke="#B14E22" stroke-width="0.9" opacity="0.7"/>
</svg>
