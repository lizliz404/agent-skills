<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="SEO Master">
  <!-- Citation Echo: retrieval waves converge on an evidence anchor -->
  <circle cx="16" cy="16" r="13.2" fill="#DCEFE8" stroke="#122B2B" stroke-width="1.6"/>
  <!-- quiet signal waves -->
  <path d="M8.2 20.9a9.5 9.5 0 0 1 12.7-12.7" stroke="#178C85" stroke-width="1.45" stroke-linecap="round"/>
  <path d="M6.8 24.5a13.6 13.6 0 0 1 18.1-18.1" stroke="#122B2B" stroke-width="1.35" stroke-linecap="round"/>
  <!-- evidence anchor -->
  <path d="m16 10.8 5.2 5.2-5.2 5.2-5.2-5.2 5.2-5.2Z" fill="#F2A83B" stroke="#122B2B" stroke-width="1.15" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="1.45" fill="#122B2B"/>
  <!-- captured citation signal -->
  <path d="m19.8 12.2 4.7-4.7" stroke="#122B2B" stroke-width="1.45" stroke-linecap="round"/>
  <circle cx="24.9" cy="7.1" r="1.55" fill="#178C85" stroke="#122B2B" stroke-width="0.8"/>
</svg>
