<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Interactive Projects Stream">
  <!-- Dual-row stream: two uneven rows of pills flowing right-to-left, motion streaks -->
  <circle cx="16" cy="16" r="13.2" fill="#E8E4DD" stroke="#1C1915" stroke-width="1.6"/>
  <!-- top row -->
  <rect x="5" y="8.4" width="9.4" height="4.6" rx="2.3" fill="#B14E22" stroke="#1C1915" stroke-width="0.9"/>
  <rect x="17.4" y="8.4" width="8.8" height="4.6" rx="2.3" fill="#1C1915" opacity="0.88"/>
  <circle cx="7.4" cy="10.7" r="1.25" fill="#E8E4DD"/>
  <circle cx="19.8" cy="10.7" r="1.25" fill="#E8E4DD" opacity="0.85"/>
  <!-- bottom row -->
  <rect x="3.8" y="19" width="6.8" height="4.6" rx="2.3" fill="#1C1915" opacity="0.7"/>
  <rect x="13.6" y="19" width="9.6" height="4.6" rx="2.3" fill="#B14E22" stroke="#1C1915" stroke-width="0.9"/>
  <rect x="26" y="19" width="4.6" height="4.6" rx="2.3" fill="#1C1915" opacity="0.5"/>
  <circle cx="16" cy="21.3" r="1.25" fill="#E8E4DD"/>
  <!-- motion streaks -->
  <path d="M30.4 11.4 L27.4 11.4" stroke="#1C1915" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M27.8 21.3 L24.6 21.3" stroke="#1C1915" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
</svg>
