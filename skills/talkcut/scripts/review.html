<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>talkcut · Review</title>
<style>
  :root{--bg:#0e0f11;--panel:#16181b;--fg:#e8e6e1;--mute:#7c7f86;--cut:#e5484d;--keep:#64a9e8;--line:#26292e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.75 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;display:grid;grid-template-columns:minmax(320px,42%) 1fr;height:100vh}
  aside{padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
  video{width:100%;max-height:62vh;background:#000;border-radius:10px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
  button:hover{border-color:var(--keep)} button.primary{background:var(--keep);color:#06121f;border-color:var(--keep);font-weight:600}
  .stat{color:var(--mute);font-size:13px} label{font-size:13px;color:var(--mute)}
  input[type=range]{accent-color:var(--keep);vertical-align:middle}
  .help{color:var(--mute);font-size:12px;line-height:1.6;margin-top:auto}
  main{overflow-y:auto;padding:28px 36px 40vh}
  .s{display:flex;gap:14px;padding:6px 10px;border-radius:8px;cursor:pointer;transition:background .12s}
  .s:hover{background:var(--panel)} .s.now{background:#1b2633}
  .t{color:var(--mute);font:12px/2.2 ui-monospace,monospace;min-width:52px}
  .x{flex:1} .r{color:var(--cut);font-size:12px;opacity:.85;margin-left:8px}
  .s.cut .x{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--cut);text-decoration-thickness:2px}
  .w.cut{text-decoration:line-through;text-decoration-color:var(--cut);color:var(--mute)}
  .w.on{color:var(--keep)}
  .gap{display:inline-block;color:#4a4e55;font-size:11px;margin:0 2px}
</style>
</head>
<body>
<aside>
  <video id="v" src="/media" controls preload="metadata"></video>
  <div class="bar">
    <button class="primary" id="save">Save ⌘S</button>
    <button id="preview">Preview final cut</button>
    <span class="stat" id="stat"></span>
  </div>
  <div class="bar"><label>Max pause <input id="pause" type="range" min="0.1" max="1.5" step="0.05"> <b id="pv"></b>s</label></div>
  <div class="help">Click a sentence: keep ⇄ cut (struck through)<br>Alt / ⌥ + click a word: cut just that word<br>Double-click: play from here<br>Preview: skips cut parts during playback<br>After saving, have the agent run render.py</div>
</aside>
<main id="list"></main>
<script>
let T, previewing = false, dirty = false;
const $ = s => document.querySelector(s), v = $('#v'), list = $('#list');
const fmt = x => `${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`;
fetch('/api/transcript').then(r => r.json()).then(d => { T = d; draw(); });

function draw() {
  $('#pause').value = T.pause_keep ?? .5; $('#pv').textContent = (+$('#pause').value).toFixed(2);
  list.innerHTML = '';
  T.sentences.forEach(s => {
    const el = document.createElement('div'); el.className = 's' + (s.keep ? '' : ' cut'); el.dataset.id = s.id;
    const x = document.createElement('span'); x.className = 'x';
    s.words.forEach((w, i) => {
      if (i && w.start - s.words[i-1].end > T.pause_keep) {
        const g = document.createElement('span'); g.className = 'gap'; g.textContent = `⏸${(w.start - s.words[i-1].end).toFixed(1)}`; x.append(g);
      }
      const ws = document.createElement('span'); ws.className = 'w' + (w.keep === false ? ' cut' : ''); ws.textContent = w.text;
      ws.onclick = e => { if (!e.altKey) return; e.stopPropagation(); w.keep = w.keep === false; ws.classList.toggle('cut'); touch(); };
      w.el = ws; x.append(ws);
    });
    if (s.reason && !s.keep) { const r = document.createElement('span'); r.className = 'r'; r.textContent = s.reason; x.append(r); }
    el.innerHTML = `<span class="t">${fmt(s.start)}</span>`; el.append(x);
    el.onclick = () => { s.keep = !s.keep; el.classList.toggle('cut', !s.keep); touch(); };
    el.ondblclick = e => { e.preventDefault(); v.currentTime = s.start; v.play(); };
    s.el = el; list.append(el);
  });
  stat();
}
function stat() {
  const all = T.sentences.length, cut = T.sentences.filter(s => !s.keep).length;
  $('#stat').textContent = `Cut ${cut} / ${all} sentences${dirty ? ' · unsaved' : ''}`;
}
function touch() { dirty = true; stat(); }
function clean() { return JSON.stringify(T, (k, val) => (k === 'el' ? undefined : val), 2); }
async function save() {
  await fetch('/api/transcript', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: clean() });
  dirty = false; stat();
}
$('#save').onclick = save;
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); } });
$('#pause').oninput = e => { T.pause_keep = +e.target.value; $('#pv').textContent = T.pause_keep.toFixed(2); touch(); };
$('#pause').onchange = () => draw();
$('#preview').onclick = () => { previewing = !previewing; $('#preview').textContent = previewing ? 'Stop preview' : 'Preview final cut'; if (previewing) v.play(); };
addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

let lastNow;
v.ontimeupdate = () => {
  const t = v.currentTime;
  const s = T.sentences.find(s => t >= s.start && t <= s.end + .3);
  if (s && s !== lastNow) { lastNow?.el.classList.remove('now'); s.el.classList.add('now'); s.el.scrollIntoView({ block: 'center', behavior: 'smooth' }); lastNow = s; }
  T.sentences.forEach(x => x.words.forEach(w => w.el.classList.toggle('on', t >= w.start && t < w.end)));
  if (!previewing) return;
  // Skip: cut sentences / cut words / pauses longer than the max
  if (s && !s.keep) { const nx = T.sentences.find(x => x.start > s.start && x.keep); if (nx) v.currentTime = nx.start; return; }
  if (s) { const w = s.words.find(w => t >= w.start && t < w.end && w.keep === false); if (w) v.currentTime = w.end; }
};
</script>
</body>
</html>
